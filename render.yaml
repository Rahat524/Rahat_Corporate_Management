services:
  - type: web
    name: rahat-corporate-management
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: ONLINE_MODE
        value: "1"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13.5"
