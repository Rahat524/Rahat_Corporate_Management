{% extends "base.html" %}

{% block content %}
<div class="settings-page">
    <h1>Settings</h1>
    <p>Manage software users, security and system information.</p>

    <div class="settings-grid">
        <a href="/settings/user-rights" class="settings-card">
            <h3>User Rights</h3>
            <p>Create users and manage module permissions.</p>
        </a>

        <a href="/settings/security" class="settings-card">
            <h3>Security System</h3>
            <p>Manage password and software security options.</p>
        </a>

        <a href="/settings/about" class="settings-card">
            <h3>About</h3>
            <p>Rahat Management System information.</p>
        </a>
    </div>
</div>

<style>
.settings-page {
    padding: 25px;
}

.settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
    margin-top: 25px;
}

.settings-card {
    display: block;
    padding: 22px;
    background: #ffffff;
    border: 1px solid #dbe3ed;
    border-radius: 12px;
    color: #152238;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.07);
}

.settings-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 18px rgba(0,0,0,.12);
}

.settings-card h3 {
    margin-top: 0;
    color: #1261a0;
}
</style>
{% endblock %}
